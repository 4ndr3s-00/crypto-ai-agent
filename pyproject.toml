[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-ai-agent"
version = "1.0.0"
description = "Agente de IA Analítico de Mercado Crypto con inferencia ultrarrápida, DuckDB sobre MinIO Parquet, sistema anti-alucinación y generación instantánea de gráficos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "duckdb>=1.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "tenacity>=8.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ingestion*", "backend*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: pruebas unitarias aisladas sin dependencias externas",
    "offline: pruebas ejecutables sin red ni servicios externos",
    "external: pruebas que requieren conexión de red o servicios externos",
    "integration: pruebas de integración con servicios externos (MinIO, Binance)",
]
testpaths = ["tests"]
